frr defaults traditional
hostname r4

interface lo
 ip address 192.168.40.1/32

interface eth1
 ip address 10.0.24.2/30
 ip ospf network point-to-point

interface eth2
 ip address 10.0.34.2/30
 ip ospf network point-to-point

interface eth3
 ip address 10.0.45.1/30
 ip ospf network point-to-point

router ospf
 ospf router-id 4.4.4.4
 network 10.0.24.0/30 area 0
 network 10.0.34.0/30 area 0
 network 10.0.45.0/30 area 0
 network 192.168.40.1/32 area 0
