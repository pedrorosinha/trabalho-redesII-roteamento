frr defaults traditional
hostname r3

interface lo
 ip address 192.168.30.1/32

interface eth1
 ip address 10.0.13.2/30

interface eth2
 ip address 10.0.34.1/30

interface eth3
 ip address 10.0.35.1/30

router rip
 version 2
 network 10.0.13.0/30
 network 10.0.34.0/30
 network 10.0.35.0/30
 network 192.168.30.1/32
