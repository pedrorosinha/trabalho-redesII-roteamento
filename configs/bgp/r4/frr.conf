frr defaults traditional
hostname r4

interface lo
 ip address 192.168.40.1/32

interface eth1
 ip address 10.0.24.2/30

interface eth2
 ip address 10.0.34.2/30

interface eth3
 ip address 10.0.45.1/30

router bgp 200
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy

 neighbor 10.0.24.1 remote-as 100
 neighbor 10.0.34.1 remote-as 200
 neighbor 10.0.45.2 remote-as 300

 address-family ipv4 unicast
  network 192.168.40.1/32
  neighbor 10.0.24.1 activate
  neighbor 10.0.34.1 activate
  neighbor 10.0.34.1 next-hop-self
  neighbor 10.0.45.2 activate
 exit-address-family
