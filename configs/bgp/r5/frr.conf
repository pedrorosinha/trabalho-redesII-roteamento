frr defaults traditional
hostname r5

interface lo
 ip address 192.168.50.1/32

interface eth1
 ip address 10.0.35.2/30

interface eth2
 ip address 10.0.45.2/30

router bgp 300
 bgp router-id 5.5.5.5
 no bgp ebgp-requires-policy

 neighbor 10.0.35.1 remote-as 200
 neighbor 10.0.45.1 remote-as 200

 address-family ipv4 unicast
  network 192.168.50.1/32
  neighbor 10.0.35.1 activate
  neighbor 10.0.45.1 activate
 exit-address-family
