frr defaults traditional
hostname r3

interface lo
 ip address 192.168.30.1/32

interface eth1
 ip address 10.0.13.2/30

interface eth2
 ip address 10.0.34.1/30

interface eth3
 ip address 10.0.35.1/30

router bgp 200
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy

 neighbor 10.0.13.1 remote-as 100
 neighbor 10.0.34.2 remote-as 200
 neighbor 10.0.35.2 remote-as 300

 address-family ipv4 unicast
  network 192.168.30.1/32
  neighbor 10.0.13.1 activate
  neighbor 10.0.34.2 activate
  neighbor 10.0.34.2 next-hop-self
  neighbor 10.0.35.2 activate
 exit-address-family
