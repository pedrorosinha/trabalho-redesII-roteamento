name: trabalho-redes

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.2
      binds:
        - configs/${PROTOCOLO}/r1/frr.conf:/etc/frr/frr.conf
        - configs/${PROTOCOLO}/r1/daemons:/etc/frr/daemons

    r2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.2
      binds:
        - configs/${PROTOCOLO}/r2/frr.conf:/etc/frr/frr.conf
        - configs/${PROTOCOLO}/r2/daemons:/etc/frr/daemons

    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.2
      binds:
        - configs/${PROTOCOLO}/r3/frr.conf:/etc/frr/frr.conf
        - configs/${PROTOCOLO}/r3/daemons:/etc/frr/daemons

    r4:
      kind: linux
      image: quay.io/frrouting/frr:8.5.2
      binds:
        - configs/${PROTOCOLO}/r4/frr.conf:/etc/frr/frr.conf
        - configs/${PROTOCOLO}/r4/daemons:/etc/frr/daemons

    r5:
      kind: linux
      image: quay.io/frrouting/frr:8.5.2
      binds:
        - configs/${PROTOCOLO}/r5/frr.conf:/etc/frr/frr.conf
        - configs/${PROTOCOLO}/r5/daemons:/etc/frr/daemons

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
    - endpoints: ["r3:eth3", "r5:eth1"]
    - endpoints: ["r4:eth3", "r5:eth2"]